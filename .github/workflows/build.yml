name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Releases from main are versioned by run number. The offset keeps them above locally built
  # APKs (versionCode 1) so Android accepts them as updates.
  VERSION_CODE: ${{ github.run_number }}00
  VERSION_NAME: 0.1.${{ github.run_number }}
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Sign with your own debug keystore so CI builds install over the app you already have.
      # Without it the runner generates a new key on every run, so releases require it.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Set the DEBUG_KEYSTORE_BASE64 secret (see README) so releases can update the installed app."
            exit 1
          else
            echo "::notice::DEBUG_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key."
          fi

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tread-sync
          path: app/build/outputs/apk/debug/tread-sync.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tread-sync

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" tread-sync.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tread Sync $VERSION_NAME" \
            --generate-notes \
            --latest
